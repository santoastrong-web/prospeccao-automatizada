<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Prospeccao — Castro telecom</title>
<style>
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;--border:#2a2a38;--accent:#8b5cf6;--accent2:#a855f7;--green:#10b981;--yellow:#f59e0b;--red:#ef4444;--blue:#3b82f6;--orange:#f97316;--text:#e2e8f0;--muted:#64748b;--card:#13131a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding:16px}
h1{font-size:18px;font-weight:800;color:white;margin-bottom:4px}
.sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;border-top:3px solid var(--accent)}
.card.green{border-top-color:var(--green)}.card.yellow{border-top-color:var(--yellow)}.card.blue{border-top-color:var(--blue)}.card.orange{border-top-color:var(--orange)}
.clabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.cval{font-size:24px;font-weight:800;color:white;margin:4px 0 0}
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-select{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px}
.checkbox-label{display:flex;align-items:center;gap:6px;cursor:pointer;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--text)}
.checkbox-label input{width:14px;height:14px;accent-color:var(--accent)}
.view-toggle{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px}
.view-btn{background:transparent;color:var(--muted);border:none;padding:6px 12px;font-size:11px;cursor:pointer;border-radius:4px;transition:.2s}
.view-btn.active{background:var(--accent);color:white}
.refresh-btn{background:var(--accent);color:white;border:none;border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer}
.refresh-btn:hover{background:var(--accent2)}
.refresh-btn:disabled{opacity:0.5;cursor:not-allowed}
.kanban{display:flex;gap:16px;overflow-x:auto;padding-bottom:16px;min-height:500px}
.kanban-column{background:var(--bg2);border:1px solid var(--border);border-radius:12px;min-width:280px;max-width:320px;flex:0 0 300px;display:flex;flex-direction:column}
.kanban-header{background:var(--bg3);border-bottom:1px solid var(--border);border-radius:12px 12px 0 0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.kanban-title{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.kanban-count{background:var(--accent);color:white;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;min-width:24px;text-align:center}
.kanban-body{flex:1;overflow-y:auto;padding:12px;min-height:400px}
.kanban-drop-zone{min-height:100px;border:2px dashed transparent;border-radius:8px;transition:.2s}
.kanban-drop-zone.active{border-color:var(--accent);background:rgba(139,92,246,.05)}
.kanban-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;cursor:grab;transition:.15s;position:relative}
.kanban-card:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.kanban-card.dragging{opacity:0.4;cursor:grabbing}
.kanban-card-name{font-weight:600;font-size:13px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kanban-card-meta{display:flex;gap:8px;font-size:11px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.kanban-card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.kanban-card-step{font-size:10px;color:var(--muted)}
.kanban-card-date{font-size:10px;color:var(--muted)}
.table-view{display:none}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--border)}
th{background:var(--bg3);padding:10px 12px;text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
td{padding:10px 12px;font-size:12px;border-top:1px solid var(--border)}
.seg{background:rgba(139,92,246,.15);color:#c4b5fd;padding:2px 8px;border-radius:12px;font-size:10px}
.status-select{background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 8px;font-size:11px;cursor:pointer;min-width:140px}
.temp-quente{background:rgba(16,185,129,.15);color:#6ee7b7;padding:2px 8px;border-radius:12px;font-size:10px}
.temp-morno{background:rgba(245,158,11,.15);color:#fcd34d;padding:2px 8px;border-radius:12px;font-size:10px}
.temp-frio{background:rgba(100,116,139,.15);color:#94a3b8;padding:2px 8px;border-radius:12px;font-size:10px}
.score{font-weight:700}.score.high{color:#6ee7b7}.score.mid{color:#fcd34d}.score.low{color:#f87171}
.step-badge{background:rgba(139,92,246,.2);color:#c4b5fd;padding:2px 8px;border-radius:6px;font-size:10px}
.notes-input{width:100%;min-width:120px;min-height:28px;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:4px 6px;font-size:11px;font-family:inherit;resize:vertical}
.loading{text-align:center;padding:40px;color:var(--muted)}
.stage-novo{border-left:3px solid var(--blue)}
.stage-qualificacao{border-left:3px solid var(--orange)}
.stage-proposta{border-left:3px solid var(--yellow)}
.stage-negociacao{border-left:3px solid var(--accent)}
.stage-ganho{border-left:3px solid var(--green)}
.stage-perdido{border-left:3px solid var(--red)}
@media (max-width: 900px){
  .kanban{flex-direction:column}
  .kanban-column{max-width:100%;min-width:0}
}
</style>
</head>

<h1>CRM Prospeccao — Castro telecom</h1>
<p class="sub" id="subtitle">Atualizado em 19/11/2026 19:53</p>

<div class="filters">

    <option value="">Todos os segmentos</option>
  </select>
  <select class="filter-select" id="filter-temperature" onchange="applyFilters()">

    <option value="morno">Morno</option>
    <option value="frio">Frio</option>

  <label class="checkbox-label">

    <span>Telefone completo</span>

    <button class="view-btn active" id="btn-kanban" onclick="switchView('kanban')">Kanban</button>
    <button class="view-btn" id="btn-table" onclick="switchView('table')">Tabela</button>
  </div>
  <button class="refresh-btn" id="refresh-btn" onclick="loadLeads()">Atualizar</button>
</div>

<div class="cards">
  <div class="card"><div class="clabel">Total</div><div class="cval" id="c-total">-</div></div>

  <div class="card yellow"><div class="clabel">Mornos</div><div class="cval" id="c-morno">-</div></div>
  <div class="card"><div class="clabel">Frios</div><div class="cval" id="c-frio">-</div></div>
  <div class="card blue"><div class="clabel">Pipeline</div><div class="cval" id="c-pipeline">-</div></div>
  <div class="card green"><div class="clabel">Ganhos</div><div class="cval" id="c-won">-</div></div>
</div>

<div class="kanban" id="kanban-view">
  <div class="kanban-column" data-stage="novo">
    <div class="kanban-header"><div class="kanban-title">🆕 Novos <span class="kanban-count" id="k-novo">0</span></div></div>
    <div class="kanban-body" id="kb-novo" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
  </div>
  <div class="kanban-column" data-stage="qualificacao">
    <div class="kanban-header"><div class="kanban-title">🎯 Qualificação <span class="kanban-count" id="k-qualificacao">0</span></div></div>
    <div class="kanban-body" id="kb-qualificacao" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
  </div>
  <div class="kanban-column" data-stage="proposta">
    <div class="kanban-header"><div class="kanban-title">📋 Proposta <span class="kanban-count" id="k-proposta">0</span></div></div>
    <div class="kanban-body" id="kb-proposta" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
  </div>
  <div class="kanban-column" data-stage="negociacao">
    <div class="kanban-header"><div class="kanban-title">🤝 Negociação <span class="kanban-count" id="k-negociacao">0</span></div></div>
    <div class="kanban-body" id="kb-negociacao" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
  </div>
  <div class="kanban-column" data-stage="ganho">
    <div class="kanban-header"><div class="kanban-title">✅ Ganho <span class="kanban-count" id="k-ganho">0</span></div></div>
    <div class="kanban-body" id="kb-ganho" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
  </div>
  <div class="kanban-column" data-stage="perdido">
    <div class="kanban-header"><div class="kanban-title">❌ Perdido <span class="kanban-count" id="k-perdido">0</span></div></div>
    <div class="kanban-body" id="kb-perdido" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)"></div>
  </div>
</div>

<div class="table-view" id="table-view">
  <table id="leads-table">

  </table>
</div>

const PIPELINE_STAGES = [
  {key:'novo', label:'Novos', icon:'🆕', color:'blue'},

];
const STATUS_KEY = 'prospecting_stage_v3';
const NOTES_KEY = 'prospecting_notes_v3';

let allLeads = [];
let filteredLeads = [];
let currentFilters = { segment: '', temperature: '' };
let showFullPhone = true;
let currentView = 'kanban';
let draggedLeadId = null;

function maskPhone(p) {
  if (!p) return '-';
  const s = String(p);
  if (showFullPhone) return s;
  return s.length >= 10 ? s.slice(0,4) + '***' + s.slice(-3) : s;
}
function scoreClass(s) { return s >= 7 ? 'high' : s >= 4 ? 'mid' : 'low'; }
function tempBadge(t) {
  const v = (t || '').toLowerCase();
  if (v === 'quente') return '<span class="temp-quente">Quente</span>';
  if (v === 'morno') return '<span class="temp-morno">Morno</span>';
  return '<span class="temp-frio">Frio</span>';
}
function loadStages() {
  try { return JSON.parse(localStorage.getItem(STATUS_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveStage(id, stage) {
  const all = loadStages();
  all[id] = stage;
  localStorage.setItem(STATUS_KEY, JSON.stringify(all));
}
function loadNotes() {
  try { return JSON.parse(localStorage.getItem(NOTES_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveNotes(id, value) {
  const all = loadNotes();
  all[id] = value;
  localStorage.setItem(NOTES_KEY, JSON.stringify(all));
}
function formatDate(iso) {
  if (!iso) return '-';
  try { return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
  catch { return iso; }
}
function formatShortDate(iso) {
  if (!iso) return '-';
  try { return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
  catch { return iso; }
}
function togglePhoneMask() {

}

  currentView = view;
  document.getElementById('kanban-view').style.display = view === 'kanban' ? 'flex' : 'none';
  document.getElementById('table-view').style.display = view === 'table' ? 'block' : 'none';
  document.getElementById('btn-kanban').classList.toggle('active', view === 'kanban');
  document.getElementById('btn-table').classList.toggle('active', view === 'table');
}

  const segments = [...new Set(allLeads.map(l => l.segment).filter(Boolean))].sort();
  const sel = document.getElementById('filter-segment');
  const current = sel.value;
  sel.innerHTML = '<option value="">Todos os segmentos</option>' +

  filteredLeads = allLeads.filter(lead => {
    if (currentFilters.segment && lead.segment !== currentFilters.segment) return false;
    if (currentFilters.temperature && lead.temperature !== currentFilters.temperature) return false;
    return true;
  });
  renderAll();
}
function renderKanban() {
  const stages = loadStages();
  const notesMap = loadNotes();
  const counts = {};
  PIPELINE_STAGES.forEach(stage => {
    const stageLeads = filteredLeads.filter(l => (stages[l.phone || l.id] || l.stage || 'novo') === stage.key);
    counts[stage.key] = stageLeads.length;
    document.getElementById(`k-${stage.key}`).textContent = stageLeads.length;
    const body = document.getElementById(`kb-${stage.key}`);
    if (stageLeads.length === 0) {
      body.innerHTML = '<div class="kanban-drop-zone" style="color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;height:100px">Arraste leads aqui</div>';
      return;
    }
    body.innerHTML = stageLeads.map(lead => {
      const id = lead.phone || lead.id;
      const savedNotes = notesMap[id] || lead.notes || '';
      const step = lead.current_step || 0;
      return `<div class="kanban-card stage-${stages[id] || lead.stage || 'novo'}" draggable="true" data-lead-id="${id}" ondragstart="dragStart(event)" ondragend="dragEnd(event)">
        <div class="kanban-card-name">${lead.business_name || '-'}</div>
        <div class="kanban-card-meta">
          <span class="seg">${lead.segment || '-'}</span>
          ${tempBadge(lead.temperature)}
          <span class="score ${scoreClass(lead.score || 0)}">Score ${lead.score || 0}</span>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${maskPhone(lead.phone)}</div>
        ${lead.email ? `<div style="font-size:11px;color:var(--muted);margin-bottom:6px">${lead.email}</div>` : ''}
        <div class="kanban-card-footer">
          <span class="kanban-card-step">Step ${step}/7</span>
          <span class="kanban-card-date">${formatShortDate(lead.created_at)}</span>
        </div>
        <textarea class="notes-input" onchange="saveNotes('${id}', this.value)" placeholder="Notas..." style="margin-top:8px;width:100%;min-height:40px">${savedNotes}</textarea>
      </div>`;
    }).join('');
  });
  document.getElementById('c-pipeline').textContent = filteredLeads.filter(l => {
    const st = stages[l.phone || l.id] || l.stage || 'novo';
    return !['ganho','perdido'].includes(st);

  document.getElementById('c-won').textContent = counts.ganho || 0;
}

    const step = lead.current_step || 0;

    return `<tr>

      <td><span class="seg">${lead.segment || '-'}</span></td>
      <td>${maskPhone(lead.phone)}</td>
      <td style="color:var(--muted)">${lead.email || '-'}</td>
      <td><span class="score ${scoreClass(lead.score || 0)}">${lead.score || 0}</span></td>
      <td>${tempBadge(lead.temperature)}</td>
      <td style="color:var(--muted);font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${lead.potential || ''}">${lead.potential || '-'}</td>
      <td><span class="step-badge">${step}/7</span></td>
      <td style="color:var(--muted);font-size:11px;white-space:nowrap">${formatShortDate(lead.created_at)}</td>
      <td><select class="status-select" onchange="saveStage('${id}', this.value); renderKanban()">${stageOpts}</select></td>
      <td><select class="status-select" onchange="saveStatusLegacy('${id}', this.value)">${TABLE_STATUS_OPTIONS.map(o => `<option value="${o}">${o}</option>`).join('')}</select></td>
      <td><textarea class="notes-input" onchange="saveNotes('${id}', this.value)" placeholder="Notas...">${savedNotes}</textarea></td>
    </tr>`;
  }).join('');
  document.getElementById('c-total').textContent = allLeads.length;
  document.getElementById('c-quente').textContent = totals.quente;
  document.getElementById('c-morno').textContent = totals.morno;
  document.getElementById('c-frio').textContent = totals.frio;
  document.getElementById('c-pipeline').textContent = totals.pipeline;
  document.getElementById('c-won').textContent = totals.won;
}
function saveStatusLegacy(id, value) {
  const key = 'prospecting_status_v2';
  try {
    const all = JSON.parse(localStorage.getItem(key) || '{}');
    all[id] = value;
    localStorage.setItem(key, JSON.stringify(all));
  } catch (e) {}
}
function renderAll() {
  if (currentView === 'kanban') renderKanban(); else renderTable();
}
function dragStart(e) {
  draggedLeadId = e.target.dataset.leadId;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function dragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.kanban-drop-zone').forEach(z => z.classList.remove('active'));
  draggedLeadId = null;
}
function dragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const zone = e.currentTarget;
  zone.classList.add('active');
}
function dragLeave(e) {
  e.currentTarget.classList.remove('active');
}
function drop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('active');
  const targetStage = e.currentTarget.closest('.kanban-column').dataset.stage;
  if (draggedLeadId && targetStage) {
    saveStage(draggedLeadId, targetStage);
    renderKanban();
  }
}
function loadLeads() {
  allLeads = LEADS_DATA || [];
  populateSegmentFilter();
  applyFilters();
  document.getElementById('subtitle').textContent = `Atualizado em ${formatDate(new Date().toISOString())} — ${allLeads.length} leads`;
}
document.addEventListener('DOMContentLoaded', loadLeads);
setInterval(() => location.reload(), AUTO_REFRESH_MS);
</script>
</body>
</html>
